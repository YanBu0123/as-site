<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>広告ボード</title>

  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .ad img {
      width: 100%;
      border-radius: 10px;
      transition: 0.2s;
    }

    .ad img:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

<h1>あなたのチャンネルをここに載せよう</h1>

<div class="grid">

  <!-- 広告1 -->
  <a class="ad" href="https://youtube.com" target="_blank">
    <img src="https://via.placeholder.com/300x150?text=募集中" />
  </a>

  <!-- 広告2 -->
  <a class="ad" href="https://youtube.com" target="_blank">
    <img src="https://via.placeholder.com/300x150?text=募集中" />
  </a>

  <!-- 広告3 -->
  <a class="ad" href="https://youtube.com" target="_blank">
    <img src="https://via.placeholder.com/300x150?text=募集中" />
  </a>

</div>

<p>掲載希望はDMへ</p>

</body>
</html>
